    <link rel="stylesheet" href="css/registration.css" th:href=@{css/registration.css}>

<body>

            <div class="logo">
                <a href="index.html" th:href=@{/}>

                    <span>ICKET</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container auth-container">
        <div class="auth-card card">
            <h1 class="page-title">Регистрация</h1>
            <form class="auth-form" method="post" th:action="@{/registration}" th:object="${clientRegistrationDto}" novalidate>
                <div class="form-group">
                    <label for="phone">Телефон</label>
                    <input type="tel" id="phone" name="phone" th:name="phoneNumber"
                           th:field="*{phoneNumber}" placeholder="+7 (___) ___-__-__"
                           th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'"
                           required>
                    <div class="invalid-feedback" th:errors="*{phoneNumber}"></div>
                    <div class="error-message" id="phone-error"></div>
                    <!--<div class="invalid-feedback" th:if="${duplicatePhoneNumber != null}" th:text="${duplicatePhoneNumber}"></div>-->
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="last-name">Фамилия</label>
                        <input type="text" id="last-name" name="last_name" th:name="lastName"
                               th:field="*{lastName}" placeholder="Введите фамилию"
                               th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"
                               required>
                        <div class="invalid-feedback" th:errors="*{lastName}"></div>
                        <div class="error-message" id="last-name-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="first-name">Имя</label>
                        <input type="text" id="first-name" name="first_name" th:name="firstName"
                               th:field="*{firstName}" placeholder="Введите имя"
                               th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"
                               required>
                        <div class="invalid-feedback" th:errors="*{firstName}"></div>
                        <div class="error-message" id="first-name-error"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="middle-name">Отчество</label>
                    <input type="text" id="middle-name" name="middle_name" th:name="middleName"
                           th:field="*{middleName}" placeholder="Введите отчество">
                    <div class="error-message" id="middle-name-error"></div>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" th:name="email"
                           th:field="*{email}" placeholder="Введите email"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           required>
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                    <div class="error-message" id="email-error"></div>
                    <!--<div class="invalid-feedback" th:if="${duplicateEmail != null}" th:text="${duplicateEmail}"></div>-->
                </div>
                <!--
                <div class="form-group">
                    <label for="birthdate">Дата рождения</label>
                    <input type="text" id="birthdate" name="birthdate" th:name="dateOfBirth"
                           th:field="*{dateOfBirth}"  placeholder="гггг-мм-дд"
                           th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid'"
                           pattern="\d{4}\-\d{2}\-\d{2}" required class="date-input">
                    <div class="invalid-feedback" th:errors="*{dateOfBirth}"></div>
                </div>
                -->
                <div class="form-group">
                    <label for="birthdate">Дата рождения</label>
                    <input type="date" id="birthdate" name="birthdate" th:name="dateOfBirth"
                           th:field="*{dateOfBirth}"
                           th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid'"
                           required class="date-input">
                    <div class="invalid-feedback" th:errors="*{dateOfBirth}"></div>
                    <div class="error-message" id="birthdate-error"></div>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" th:name="password"
                           th:field="*{password}" placeholder="Введите пароль"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           required>
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                    <div class="error-message" id="password-error"></div>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Подтвердите пароль</label>
                    <input type="password" id="confirm-password" name="confirm_password"
                           th:field="*{confirmPassword}" placeholder="Повторите пароль"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                           required>
                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                    <div class="error-message" id="confirm-password-error"></div>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="agree" name="agree" required>
                    <label for="agree">Соглашаюсь с условиями передачи данных</label>
                </div>
                <button type="button" id="registration" class="btn auth-btn">Зарегистрироваться</button>
                <div class="auth-links">
                    <a href="login.html" th:href=@{/login}>Уже есть аккаунт? Войти</a>
                </div>
            </form>

    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
